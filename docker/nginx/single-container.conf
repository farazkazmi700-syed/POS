log_format pos_json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
  '"path":"$uri","status":$status,"seconds":$request_time,"bytes":$body_bytes_sent}';

server {
  listen 8080;
  server_name _;
  root /var/www/pos-system;
  index index.html;
  client_max_body_size 10m;
  access_log /dev/stdout pos_json;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Request-ID $request_id always;
  add_header Referrer-Policy no-referrer always;

  location = /health {
    proxy_pass http://127.0.0.1:3000/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
