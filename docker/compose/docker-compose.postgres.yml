# Standalone PostgreSQL service for KazmiOn development and migration.
# Usage:
#   docker compose -f docker/compose/docker-compose.postgres.yml up -d
#   Connection: postgresql://kazmion:${POSTGRES_PASSWORD}@localhost:5432/kazmion
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: kazmion-postgres
    environment:
      POSTGRES_USER: kazmion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kazmion
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../deploy/database/postgresql/migrations:/opt/pos/sql-migrations:ro
      - ../postgres/init-relational-schema.sh:/docker-entrypoint-initdb.d/10-init-relational-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazmion -d kazmion"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
