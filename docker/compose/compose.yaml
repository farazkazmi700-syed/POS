name: kazmion
services:
  kazmion:
    container_name: kazmion-pos
    image: ${KAZMION_IMAGE:-kazmion/pos:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 120s
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      PORT: "3000"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?set PASSWORD_RESET_BASE_URL in .env}
      PLATFORM_DEVELOPER_EMAIL: ${PLATFORM_DEVELOPER_EMAIL:-developer@pos.local}
      PLATFORM_DEVELOPER_SETUP_TOKEN: ${PLATFORM_DEVELOPER_SETUP_TOKEN:?set PLATFORM_DEVELOPER_SETUP_TOKEN in .env}
      PGDATA: /var/lib/postgresql/data/cluster
      POS_SERVE: "true"
      STORAGE_DIR: /data/invoices
    ports:
      # Application entry point only. PostgreSQL, FerretDB gateway and Redis stay loopback-internal.
      - "127.0.0.1:8080:8080"
    volumes:
      - kazmion_queue:/data/redis
      - kazmion_pgdata:/var/lib/postgresql/data
      - kazmion_uploads:/data/invoices
      - kazmion_backups:/app/backups
    healthcheck:
      test: ["CMD", "/usr/local/bin/pos-healthcheck"]
      interval: 20s
      timeout: 5s
      start_period: 240s
      retries: 5
volumes:
  kazmion_pgdata:
    external: ${KAZMION_EXISTING_VOLUMES:-false}
    name: ${KAZMION_PG_VOLUME:-kazmion_pgdata}
  kazmion_uploads:
    external: ${KAZMION_EXISTING_VOLUMES:-false}
    name: ${KAZMION_UPLOAD_VOLUME:-kazmion_uploads}
  kazmion_backups:
    name: kazmion_backups
  kazmion_queue:
    external: ${KAZMION_EXISTING_VOLUMES:-false}
    name: ${KAZMION_QUEUE_VOLUME:-kazmion_queue}
