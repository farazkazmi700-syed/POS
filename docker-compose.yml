name: pos-postgresql
services:
  pos-system:
    container_name: pos-system
    image: pos-system:postgres
    build:
      context: .
      dockerfile: Dockerfile.single
    env_file:
      - .env
    environment:
      PORT: 3000
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?set PASSWORD_RESET_BASE_URL in .env}
      PLATFORM_DEVELOPER_SETUP_TOKEN: ${PLATFORM_DEVELOPER_SETUP_TOKEN:?set PLATFORM_DEVELOPER_SETUP_TOKEN in .env}
      PGDATA: /var/lib/postgresql/data/cluster
      POS_SERVE: "true"
      STORAGE_DIR: /data/invoices
    ports:
      - "8080:80"
      - "3000:3000"
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
      - redis_data:/data/redis
      - invoice_data:/data/invoices
    restart: unless-stopped

volumes:
  pos_postgres_data:
    name: pos_system_postgres17_live
  redis_data:
    name: kazmion_redis_data
  invoice_data:
    name: kazmion_invoice_data
