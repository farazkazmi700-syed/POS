# Development / single-server stack:  docker compose up --build
# Open the app at http://localhost:8080   (API docs: http://localhost:3000/api/docs)
services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/pos
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?set PASSWORD_RESET_BASE_URL in .env}
      DEV_ACCOUNT_EMAIL: ${DEV_ACCOUNT_EMAIL:-}
      DEV_ACCOUNT_PASSWORD_HASH: ${DEV_ACCOUNT_PASSWORD_HASH:-}
      PLATFORM_DEVELOPER_EMAIL: ${PLATFORM_DEVELOPER_EMAIL:-}
      PLATFORM_DEVELOPER_SETUP_TOKEN: ${PLATFORM_DEVELOPER_SETUP_TOKEN:?set PLATFORM_DEVELOPER_SETUP_TOKEN in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BACKUP_MODE: ${BACKUP_MODE:-offline}
      BACKUP_EMAIL_TO: ${BACKUP_EMAIL_TO:-}
      BACKUP_DRIVE_CLIENT_ID: ${BACKUP_DRIVE_CLIENT_ID:-}
      BACKUP_DRIVE_CLIENT_SECRET: ${BACKUP_DRIVE_CLIENT_SECRET:-}
      BACKUP_DRIVE_REFRESH_TOKEN: ${BACKUP_DRIVE_REFRESH_TOKEN:-}
      BACKUP_DRIVE_FOLDER_ID: ${BACKUP_DRIVE_FOLDER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
      STORAGE_DIR: /data/record of business
      REPORT_TZ: ${REPORT_TZ:-Asia/Karachi}
    volumes: [invoice_data:/data/record of business]
    ports: ["3000:3000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  pdf-worker:
    build: { context: ., dockerfile: apps/pdf-worker/Dockerfile }
    environment:
      MONGO_URI: mongodb://mongo:27017/pos
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/record of business
      REPORT_TZ: ${REPORT_TZ:-Asia/Karachi}
      WORKER_CONCURRENCY: 2
    volumes: [invoice_data:/data/record of business]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
  invoice_data:
