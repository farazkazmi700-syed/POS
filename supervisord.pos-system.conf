[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord-pos-system.pid

[program:mongo]
command=/usr/bin/mongod --bind_ip 127.0.0.1 --dbpath /data/mongo
user=mongodb
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --appendonly yes --dir /data/redis
user=redis
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1
user=postgres
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/bin/sh -c 'until nc -z 127.0.0.1 27017 && nc -z 127.0.0.1 6379; do sleep 1; done; exec node /app/api/dist/main'
directory=/app/api
user=node
environment=PORT="3000",MONGO_URI="mongodb://127.0.0.1:27017/pos",REDIS_URL="redis://127.0.0.1:6379",STORAGE_DIR="/data/invoices"
autostart=true
autorestart=true
startsecs=10
startretries=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pdf-worker]
command=/bin/sh -c 'until nc -z 127.0.0.1 27017 && nc -z 127.0.0.1 6379; do sleep 1; done; exec node /app/worker/dist/worker.js'
directory=/app/worker
user=node
environment=MONGO_URI="mongodb://127.0.0.1:27017/pos",REDIS_URL="redis://127.0.0.1:6379",STORAGE_DIR="/data/invoices",PUPPETEER_EXECUTABLE_PATH="/usr/bin/chromium",PUPPETEER_SKIP_DOWNLOAD="true",WORKER_CONCURRENCY="2"
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
