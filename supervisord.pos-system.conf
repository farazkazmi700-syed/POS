[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord-pos-system.pid

[program:gateway]
command=/usr/local/bin/ferretdb --postgresql-url-file=/run/pos/gateway-uri --listen-addr=127.0.0.1:27017 --telemetry=disable --state-dir=/run/pos/gateway
user=ferret
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --appendonly yes --dir /data/redis/pos-redis7
user=redis
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -c cron.host=/var/run/postgresql
user=root
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/start-pos-app /app/api/dist/main
directory=/app/api
user=node
environment=PORT="3000",REDIS_URL="redis://127.0.0.1:6379",STORAGE_DIR="/data/invoices"
autostart=%(ENV_POS_SERVE)s
autorestart=true
startsecs=10
startretries=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pdf-worker]
command=/usr/local/bin/start-pos-app /app/worker/dist/worker.js
directory=/app/worker
user=node
environment=HOME="/home/node",REDIS_URL="redis://127.0.0.1:6379",STORAGE_DIR="/data/invoices",PUPPETEER_EXECUTABLE_PATH="/usr/bin/chromium",PUPPETEER_SKIP_DOWNLOAD="true",WORKER_CONCURRENCY="2"
autostart=%(ENV_POS_SERVE)s
autorestart=true
startsecs=5
startretries=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=%(ENV_POS_SERVE)s
autorestart=true
startsecs=2
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
