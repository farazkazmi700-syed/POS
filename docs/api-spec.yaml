info:
  title: POS API
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        businessName:
          type: string
        domainType:
          type: string
          enum:
            - retail
            - restaurant
            - pharmacy
            - salon
            - custom
        ownerName:
          type: string
        email:
          type: string
        password:
          type: string
        taxRegNo:
          type: string
        address:
          type: string
        currency:
          type: string
          example: PKR
      required:
        - businessName
        - domainType
        - ownerName
        - email
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CreateStaffDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
            - admin
            - cashier
      required:
        - name
        - email
        - password
        - role
    TaxProfileDto:
      type: object
      properties: {}
    UpdateTenantDto:
      type: object
      properties:
        name:
          type: string
        domainType:
          type: string
          enum:
            - retail
            - restaurant
            - pharmacy
            - salon
            - custom
        address:
          type: string
        taxRegNo:
          type: string
        currency:
          type: string
        invoicePrefix:
          type: string
        logoUrl:
          type: string
        taxProfile:
          $ref: '#/components/schemas/TaxProfileDto'
    CreateProductDto:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        unit:
          type: string
          example: pcs
        price:
          type: number
        costPrice:
          type: number
        stockQty:
          type: number
        lowStockThreshold:
          type: number
        trackStock:
          type: boolean
        taxClass:
          type: string
          enum:
            - standard
            - reduced
            - exempt
        attributes:
          type: object
          description: Free-form, domain-specific fields
        imageUrl:
          type: string
      required:
        - name
        - price
    BulkCreateProductsDto:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/CreateProductDto'
      required:
        - products
    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        unit:
          type: string
          example: pcs
        price:
          type: number
        costPrice:
          type: number
        stockQty:
          type: number
        lowStockThreshold:
          type: number
        trackStock:
          type: boolean
        taxClass:
          type: string
          enum:
            - standard
            - reduced
            - exempt
        attributes:
          type: object
          description: Free-form, domain-specific fields
        imageUrl:
          type: string
        isActive:
          type: boolean
    OrderItemDto:
      type: object
      properties:
        productId:
          type: string
        qty:
          type: number
          example: 1
        discountPercent:
          type: number
          example: 0
      required:
        - productId
        - qty
    PreviewOrderDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
      required:
        - items
    CustomerDto:
      type: object
      properties: {}
    CreateOrderDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        paymentMode:
          type: string
          enum:
            - cash
            - card
            - wallet
        customer:
          $ref: '#/components/schemas/CustomerDto'
        note:
          type: string
      required:
        - items
        - paymentMode
