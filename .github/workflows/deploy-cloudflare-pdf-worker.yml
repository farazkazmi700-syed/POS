name: Deploy PDF Worker to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: 
      - 'app/pdf-worker/**'
      - 'app/packages/invoice-store/**'
      - '.github/workflows/deploy-cloudflare-pdf-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app/pdf-worker
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/pdf-worker/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build PDF Worker
        run: npm run build
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: app/pdf-worker
          environment: production