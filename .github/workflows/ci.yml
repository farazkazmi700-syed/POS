name: CI
on:
  push: { branches: [main, dev] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 6
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 6
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --test qa/backup-delivery.test.cjs
        working-directory: .
      - run: node ../../qa/api-integration.cjs

  pdf-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/pdf-worker } }
    env: { PUPPETEER_SKIP_DOWNLOAD: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/pdf-worker/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node --test dist/services/invoice-renderer.test.js

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
      # Barcode browser tests exercise the actual API encoder, then independently decode its output.
      - run: npm ci --ignore-scripts
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

      - run: npm exec --yes --package=@playwright/test -- playwright install --with-deps chromium
      - run: npm exec --yes --package=@playwright/test -- playwright test --config=qa/playwright.config.cjs
        working-directory: .

  docker:
    needs: [api, pdf-worker, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
