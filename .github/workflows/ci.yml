name: CI
on:
  push: { branches: [main, dev, 'release/**'] }
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact workflow revision
        working-directory: .
        run: |
          git init --quiet
          git fetch --no-tags --depth=2 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Check patch whitespace and shell syntax
        run: |
          git diff --check HEAD^ HEAD
          bash -n .github/scripts/setup-node.sh
          for file in docker/*.sh docker/postgres/*.sh; do sh -n "$file"; done

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 6
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 6
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: pos_appearance_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d pos_appearance_test" --health-interval 5s --health-timeout 3s --health-retries 6
    defaults: { run: { working-directory: app/api } }
    steps:
      - name: Check out the exact workflow revision
        working-directory: .
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Set up Node.js
        working-directory: .
        run: bash .github/scripts/setup-node.sh
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Run standalone regression tests
        run: node --test qa/backup-delivery.test.cjs qa/installment-invoice-view.test.cjs qa/invoice-snapshot.test.cjs qa/tenant-trash.test.cjs
        working-directory: .
      - name: Run live API regression tests
        run: |
          node ../../qa/api-integration.cjs
          node ../../qa/api-integration.cjs --branches
          node ../../qa/api-integration.cjs --backup
          node ../../qa/api-integration.cjs --appearance
        env:
          PASSWORD_RESET_BASE_URL: http://localhost:5173/reset-password
          SPEC_APPEARANCE_POSTGRES_URL: postgres://postgres:ci-fixture-only@127.0.0.1:5432/pos_appearance_test
      - name: Rehearse PostgreSQL sync migration and export
        working-directory: .
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          SPEC_SYNC_POSTGRES_URL: postgres://postgres:ci-fixture-only@127.0.0.1:5432/pos_sync_rehearsal
        run: |
          docker exec "$POSTGRES_SERVICE" createdb -U postgres pos_sync_rehearsal
          npm ci --prefix deploy/scripts/migration
          node --test qa/sync-v2-postgres.test.cjs

  pdf-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: app/pdf-worker } }
    env: { PUPPETEER_SKIP_DOWNLOAD: "true" }
    steps:
      - name: Check out the exact workflow revision
        working-directory: .
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Set up Node.js
        working-directory: .
        run: bash .github/scripts/setup-node.sh
      - run: npm ci
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 6
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 6
    defaults: { run: { working-directory: app/web } }
    env:
      POS_E2E_START_API: '1'
    steps:
      - name: Check out the exact workflow revision
        working-directory: .
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Set up Node.js
        working-directory: .
        run: bash .github/scripts/setup-node.sh
      - run: npm ci
      - run: npm run build
      # Barcode browser tests exercise the actual API encoder, then independently decode its output.
      - run: npm ci
        working-directory: app/api
      - run: npm run build
        working-directory: app/api
      - run: npm ci
        working-directory: .
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: .
      - run: npx --no-install playwright test --config=qa/playwright.config.cjs
        working-directory: .

  docker:
    needs: [repository, api, pdf-worker, web]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact workflow revision
        working-directory: .
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - run: bash .github/scripts/setup-node.sh
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: docker build --platform linux/amd64 -f docker/Dockerfile -t kazmion/pos:ci .
      - run: node qa/smoke-container.cjs kazmion/pos:ci
      - name: Rehearse LAN access, sale recovery and encrypted restore
        env:
          SPEC_LAN_POS_IMAGE: kazmion/pos:ci
        run: node --test qa/lan-protection.test.cjs
