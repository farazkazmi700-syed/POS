name: Deploy web to Cloudflare Pages

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Check out workflow commit
        working-directory: .
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Set up Node.js
        working-directory: .
        run: bash .github/scripts/setup-node.sh
      - run: npm ci
      - name: Build Pages bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node -e 'const url = new URL(process.env.VITE_API_BASE_URL); if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || !url.pathname.endsWith("/api")) throw new Error("Set VITE_API_BASE_URL to the HTTPS API origin ending in /api")'
          npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.168.0 pages deploy dist --project-name=kazmion-pos-web --branch=main
